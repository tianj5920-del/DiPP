[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dipp-label"
version = "0.1.0"
description = "LR-guided Gaussian prototype and control-kernel fusion for plasma proteomics"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<1.7", "torch>=2.2,<3"]

[project.optional-dependencies]
analysis = ["shap==0.46.0"]
baselines = ["lightgbm>=4.0,<5", "xgboost>=2.0,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
dipp-label = "dipp_label.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
